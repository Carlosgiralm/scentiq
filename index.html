<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScentIQ — Asesor Personal de Perfumes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;--bg2:#111113;--bg3:#18181b;--bg4:#222226;--bg5:#2c2c32;
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:#f5ead0;
  --gd:rgba(201,168,76,0.1);--gb:rgba(201,168,76,0.2);--gb2:rgba(201,168,76,0.38);
  --text:#f2ede6;--text2:#b0a090;--text3:#6a5f50;--text4:#3a342c;
  --green:#4ade80;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --r:10px;--r2:18px;--r3:24px;
}
html,body{height:100%;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;min-height:100vh;
  background-image:radial-gradient(ellipse 90% 40% at 50% -10%,rgba(201,168,76,0.07) 0%,transparent 60%)}

.hdr{padding:1.1rem 2rem;border-bottom:0.5px solid var(--gb);display:flex;align-items:center;justify-content:space-between;
  background:rgba(9,9,11,0.97);backdrop-filter:blur(20px);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:50%;border:0.5px solid var(--gb2);background:var(--gd);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.bname{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:0.06em}
.bname span{color:var(--gold)}
.bsub{font-size:10px;color:var(--text3);letter-spacing:0.14em;text-transform:uppercase;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:10px}
.weather-pill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);
  padding:5px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg3)}
.wdot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green)}
.user-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gold2);
  padding:5px 12px;border-radius:20px;border:0.5px solid var(--gb);background:var(--gd);display:none}

.prog-bar{height:1px;background:var(--bg4)}
.prog-fill{height:1px;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0%;transition:width .6s ease}

.prof-bar{margin:.75rem 2rem 0;padding:10px 16px;border:0.5px solid var(--gb);border-radius:var(--r);background:var(--gd);display:none}
.prof-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.prof-tags{display:flex;flex-wrap:wrap;gap:6px}
.ptag{font-size:11px;padding:3px 11px;border-radius:20px;border:0.5px solid var(--gb2);color:var(--gold2);background:rgba(201,168,76,0.07)}

.chat{flex:1;overflow-y:auto;padding:1.25rem 2rem;display:flex;flex-direction:column;gap:12px}
.chat::-webkit-scrollbar{width:3px}
.chat::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}

.msg{display:flex;gap:10px;align-items:flex-start;animation:fu .26s ease}
.msg.user{flex-direction:row-reverse}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.av.bot{border:0.5px solid var(--gb2);background:var(--gd);color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:15px}
.av.user{background:var(--bg4);color:var(--text2);border:0.5px solid var(--border2);letter-spacing:.04em}

.bub{max-width:82%;padding:11px 15px;font-size:14px;line-height:1.75;border-radius:var(--r2)}
.bub.bot{background:var(--bg3);border:0.5px solid var(--bg5);border-top-left-radius:4px;color:var(--text)}
.bub.user{background:var(--bg4);border:0.5px solid var(--gb);border-top-right-radius:4px;color:var(--text)}

.rec-section{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.rec-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.rcard{background:var(--bg2);border:0.5px solid var(--gb);border-radius:var(--r2);overflow:hidden;transition:border-color .2s}
.rcard:hover{border-color:var(--gb2)}
.rcard-img{width:100%;height:160px;object-fit:cover;opacity:0.85;display:block;background:var(--bg4)}
.rcard-img-placeholder{width:100%;height:160px;background:linear-gradient(135deg,var(--bg3),var(--bg4));display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--text4)}
.rcard-top{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rcard-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:400;color:var(--gold3);letter-spacing:.03em;line-height:1.2}
.rcard-house{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.rcard-pct{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:var(--gold);line-height:1;text-align:right}
.rcard-pct-lbl{font-size:9px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;text-align:right}
.rcard-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px;border-top:0.5px solid var(--bg4);padding-top:10px}
.rrow{display:flex;gap:8px;align-items:flex-start}
.rico{font-size:12px;flex-shrink:0;opacity:.55;margin-top:1px}
.rtxt{font-size:12px;color:var(--text2);line-height:1.55}
.rtxt.emo{color:var(--gold2);font-style:italic}
.rprice{display:flex;justify-content:space-between;align-items:center;margin-top:6px;
  padding:8px 12px;background:var(--bg3);border-radius:var(--r);border:0.5px solid var(--bg5)}
.rprice-val{font-size:13px;font-weight:500;color:var(--text)}
.rprice-vendor{font-size:11px;color:var(--text3)}

.tdots{display:flex;gap:5px;align-items:center;padding:5px 0}
.dot{width:4px;height:4px;border-radius:50%;background:var(--gb2);animation:blink 1.3s infinite}
.dot:nth-child(2){animation-delay:.22s}.dot:nth-child(3){animation-delay:.44s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

.quick-area{padding:.75rem 2rem}
.quick-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.quick-row{display:flex;flex-wrap:wrap;gap:7px}
.qbtn{font-size:12px;padding:7px 15px;border-radius:20px;border:0.5px solid var(--bg5);
  background:transparent;color:var(--text2);cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif}
.qbtn:hover{border-color:var(--gb2);color:var(--gold2);background:var(--gd)}

.inp-area{padding:.75rem 2rem 1.5rem;border-top:0.5px solid var(--bg4);background:rgba(9,9,11,.98)}
.inp-row{display:flex;gap:9px;align-items:flex-end}
#inp{flex:1;padding:11px 16px;font-size:14px;border-radius:var(--r3);border:0.5px solid var(--bg5);
  background:var(--bg3);color:var(--text);resize:none;font-family:'Inter',sans-serif;
  line-height:1.55;height:44px;max-height:120px;overflow:hidden;transition:border-color .22s}
#inp::placeholder{color:var(--text3)}
#inp:focus{outline:none;border-color:var(--gb2)}
.sbtn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#b8942a,#e8c87a);
  border:none;cursor:pointer;color:#1a1000;font-size:17px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .18s,transform .12s}
.sbtn:hover{opacity:.86;transform:scale(1.06)}
.sbtn:disabled{opacity:.28;cursor:default;transform:none}
.hint{font-size:10px;color:var(--text4);margin-top:7px;text-align:center;letter-spacing:.06em;text-transform:uppercase}

@media(max-width:600px){
  .hdr,.chat,.quick-area,.inp-area,.prof-bar{padding-left:1rem;padding-right:1rem}
  .prof-bar{margin-left:1rem;margin-right:1rem}
}
</style>
</head>
<body>
<div class="hdr">
  <div class="brand">
    <div class="logo">◈</div>
    <div>
      <div class="bname">Scent<span>IQ</span></div>
      <div class="bsub">Asesor personal de perfumes</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="user-pill" id="user-pill">👤 <span id="user-visits"></span></div>
    <div class="weather-pill" id="weather-pill"><div class="wdot"></div><span id="weather-txt">Detectando clima...</span></div>
  </div>
</div>

<div class="prog-bar"><div class="prog-fill" id="prog"></div></div>

<div class="prof-bar" id="prof-bar">
  <div class="prof-lbl">Perfil olfativo</div>
  <div class="prof-tags" id="ptags"></div>
</div>

<div class="chat" id="chat"></div>

<div class="quick-area" id="quick-area">
  <div class="quick-lbl">Accesos rápidos</div>
  <div class="quick-row">
    <button class="qbtn" onclick="sq('Quiero empezar en la perfumería desde cero')">Empezar desde cero</button>
    <button class="qbtn" onclick="sq('Tengo una cita romántica esta noche')">Cita romántica</button>
    <button class="qbtn" onclick="sq('Necesito un perfume para la oficina')">Para la oficina</button>
    <button class="qbtn" onclick="sq('Busco un regalo de perfume con 80 USD')">Para regalar</button>
    <button class="qbtn" onclick="sq('Quiero algo para el gimnasio y casual')">Gym y casual</button>
  </div>
</div>

<div class="inp-area">
  <div class="inp-row">
    <textarea id="inp" placeholder="Cuéntame qué buscas o cómo te sientes hoy..." onkeydown="hk(event)" oninput="ar(this)"></textarea>
    <button class="sbtn" id="sbtn" onclick="send()">➤</button>
  </div>
  <div class="hint">Próximamente · Análisis por foto · Alertas de precio · Wishlist</div>
</div>

<script>
const SUPABASE_URL = 'https://zdftewqlzulsjbfvpklt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_N7ZBku1noylkIORSqwhmDw_zGpyAV4j';

// ── FINGERPRINT ──
function getFingerprint() {
  const nav = window.navigator;
  const raw = [
    nav.userAgent, nav.language, nav.platform,
    screen.width+'x'+screen.height, screen.colorDepth,
    Intl.DateTimeFormat().resolvedOptions().timeZone,
    nav.hardwareConcurrency||'',
  ].join('|');
  let hash = 0;
  for(let i=0;i<raw.length;i++){hash=((hash<<5)-hash)+raw.charCodeAt(i);hash|=0;}
  return 'fp_'+Math.abs(hash).toString(36);
}
const FINGERPRINT = getFingerprint();

// ── WEATHER ──
let weatherCtx = '', weatherSummary = '';
async function getWeather() {
  try {
    const geo = await fetch('https://ipapi.co/json/');
    const gd = await geo.json();
    const city = gd.city||'tu ciudad', country = gd.country_name||'';
    const lat = gd.latitude, lon = gd.longitude;
    const wr = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relative_humidity_2m&timezone=auto`);
    const wd = await wr.json();
    const temp = Math.round(wd.current_weather?.temperature??0);
    const humidity = wd.hourly?.relative_humidity_2m?.[0]??50;
    const code = wd.current_weather?.weathercode??0;
    const cond = code===0?'despejado':code<3?'parcialmente nublado':code<60?'nublado':'lluvia';
    const hour = new Date().getHours();
    const momento = hour<12?'mañana':hour<18?'tarde':'noche';
    weatherCtx = `Ciudad: ${city}, ${country}. Temperatura: ${temp}°C. Humedad: ${humidity}%. Condición: ${cond}. Momento del día: ${momento}.
Impacto en perfumería: ${temp>27?'Clima CALIENTE — recomendar frescos, acuáticos, cítricos ligeros. Evitar orientales pesados.':temp>20?'Clima TEMPLADO — funciona casi todo. Preferir moderados.':'Clima FRÍO — orientales, amaderados y especiados proyectan perfectamente. Evitar frescos muy ligeros.'}
${humidity>70?'Humedad ALTA — los perfumes proyectan más, reducir cantidad aplicada. Evitar exceso de orientales pesados.':''}`;
    weatherSummary = `${city} · ${temp}°C ${temp>25?'☀️':temp>15?'🌤':'🌧'}`;
    document.getElementById('weather-txt').textContent = weatherSummary;
  } catch(e) {
    document.getElementById('weather-txt').textContent = 'Clima no disponible';
  }
}

// ── USER MEMORY from Supabase ──
let userMemory = null;
async function loadUserMemory() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/users?fingerprint=eq.${FINGERPRINT}&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const users = await res.json();
    if (users && users.length > 0) {
      userMemory = users[0];
      const pill = document.getElementById('user-pill');
      const visits = document.getElementById('user-visits');
      pill.style.display = 'flex';
      visits.textContent = `Visita #${userMemory.visit_count + 1}`;
    }
  } catch(e) { console.log('Memory load failed:', e); }
}

// ── SYSTEM PROMPT ──
function getSystem() {
  let memCtx = '';
  if (userMemory && userMemory.profile && Object.keys(userMemory.profile).length > 0) {
    const p = userMemory.profile;
    memCtx = `\n\nMEMORIA DE VISITAS ANTERIORES (${userMemory.visit_count} visitas):
${p.nombre?`Nombre: ${p.nombre}.`:''}${p.genero?` Género: ${p.genero}.`:''}${p.ciudad?` Ciudad: ${p.ciudad}.`:''}
${p.presupuesto?`Presupuesto típico: ${p.presupuesto}.`:''}${p.familias_favoritas?` Familias favoritas: ${p.familias_favoritas}.`:''}
${p.perfumes_tiene?`Perfumes que tiene: ${p.perfumes_tiene}.`:''}${p.notas_gustadas?` Notas que le gustan: ${p.notas_gustadas}.`:''}
USA ESTA INFORMACIÓN. Salúdalo de vuelta. No repitas preguntas ya respondidas.`;
  }

  return `Eres ScentIQ, el mejor asesor de perfumería del mundo. Combinas maestría técnica de perfumista, neurociencia del olfato y psicología profunda del cliente latinoamericano.

DATOS EN TIEMPO REAL:
${weatherCtx || 'Clima no disponible — pregunta la ciudad.'}
${memCtx}

CONOCIMIENTO COMPLETO:
Familias: fougère, oriental/oud, chypre, floral, fresco/cítrico, amaderado, gourmand, cuero, acuático, especiado, árabe/oud, incienso
Marcas lujo: Creed, Parfums de Marly, MFK, Dior, Chanel, Tom Ford, Xerjoff, Nishane, Byredo, Initio, Amouage, Roja Parfums
Marcas mid: Montale, Fragrance du Bois, Abraaj, Zimaya, Memo Paris, Penhaligon's
Marcas accesibles: Armaf, Lattafa, Afnan, Rasasi, Al Haramain, Oud Elite, Ard Al Zaafaran, Maison Alhambra
Vendors Colombia: Disfragancias, Valmara, MaferPerfumes, Aromas y Perfumes

EQUIVALENCIAS CLAVE:
Creed Aventus ≈ Armaf Club de Nuit Intense Man (~$35)
Dior Sauvage Elixir ≈ Lattafa Asad (~$25)
Initio Absolute Aphrodisiac ≈ Lattafa Khamrah (~$30)
Paco Rabanne 1 Million ≈ Afnan 9PM (~$20)
YSL Y EDP ≈ Armaf Hunter (~$30)
Bleu de Chanel EDP ≈ Armaf Tres Nuit (~$30)
Parfums de Marly Layton ≈ Maison Alhambra Lathan (~$35)
Xerjoff Erba Pura ≈ Lattafa Yara (~$25)

REGLAS CRÍTICAS:
1. Si el usuario menciona Lattafa/Rasasi/Armaf/árabe/oud → recomendar DENTRO de ese universo primero
2. Si le gusta Asad → recomendar: Khamrah, Oud Mood, Al Haramain Amber Oud, Lattafa Oud for Glory, Afnan Supremacy Noir
3. Si presupuesto bajo (<$50) → NO recomendar lujo como primera opción
4. SIEMPRE usar el clima actual para recomendar
5. Humedad alta → advertir sobre proyección amplificada
6. Hora del día → considerar en la recomendación (matutino vs nocturno)
7. Tipo de piel si se menciona → grasa=más duración, seca=menos duración

METODOLOGÍA:
FASE 1 — Perfil rápido: género, ocasión, presupuesto, perfumes que ya tiene
FASE 2 — ADN emocional: memorias olfativas, identidad deseada, cómo quiere ser recordado
FASE 3 — Recomendación con imágenes

FORMATO DE RECOMENDACIÓN — usa EXACTAMENTE este JSON:
<RECS>
[
  {
    "nombre": "Nombre exacto del perfume",
    "casa": "Casa perfumista",
    "match": "95%",
    "notas": "Bergamota, cardamomo → oud, rosa → sándalo, almizcle blanco",
    "emocion": "Evoca noches cálidas de Dubái, presencia magnética e inconfundible",
    "tecnico": "Proyección alta · Duración 10-12h · Ideal para clima frío",
    "precio": "~$30 USD",
    "vendor": "MaferPerfumes / Valmara",
    "imagen_query": "Lattafa Khamrah perfume bottle"
  }
]
</RECS>

El campo imagen_query es el texto exacto para buscar la imagen del frasco en Google.
Habla cálido y cercano. SIEMPRE en español.`;
}

// ── GOOGLE IMAGE SEARCH ──
async function fetchPerfumeImage(query) {
  try {
    const res = await fetch(`/api/image?q=${encodeURIComponent(query)}`);
    if (!res.ok) return null;
    const data = await res.json();
    return data.imageUrl || null;
  } catch(e) { return null; }
}

// ── STATE ──
let msgs=[], profile={}, busy=false;

function extractProfile(t) {
  const l=t.toLowerCase();
  if(l.match(/\bsoy hombre\b|\bmasculin/))profile.genero='Hombre';
  else if(l.match(/\bsoy mujer\b|\bfemenin/))profile.genero='Mujer';
  ['bogotá','bogota','medellín','medellin','cali','barranquilla','santa marta','cartagena'].forEach(c=>{
    if(l.includes(c))profile.ciudad=c.charAt(0).toUpperCase()+c.slice(1);
  });
  if(l.includes('oficina')||l.includes('trabajo'))profile.uso='Profesional';
  else if(l.includes('cita')||l.includes('romántic'))profile.uso='Nocturno';
  else if(l.includes('casual')||l.includes('gym'))profile.uso='Casual';
  if(l.match(/\$\d+/)||l.includes('presupuesto'))profile.presupuesto='Indicado';
  if(l.includes('lattafa')||l.includes('árabe')||l.includes('oud')||l.includes('rasasi'))profile.universo='Oriental/Árabe';
  renderProfile();
  if(msgs.length===2)setPhase(1);
  if(msgs.length>=4)setPhase(2);
}

function renderProfile(){
  const keys=Object.keys(profile);
  if(!keys.length)return;
  document.getElementById('prof-bar').style.display='block';
  const lb={genero:'Género',ciudad:'Ciudad',uso:'Ocasión',presupuesto:'Presupuesto',universo:'Universo'};
  document.getElementById('ptags').innerHTML=keys.map(k=>`<span class="ptag">${lb[k]||k}: ${profile[k]}</span>`).join('');
}

const progs=[0,33,66,100];
function setPhase(i){document.getElementById('prog').style.width=(progs[i]||100)+'%';}

// ── RENDER RECS ──
async function parseReply(t) {
  if (!t.includes('<RECS>')) return t.replace(/\n/g,'<br>');
  const si=t.indexOf('<RECS>'), ei=t.indexOf('</RECS>');
  const before=t.slice(0,si).replace(/\n/g,'<br>');
  const after=ei>-1?t.slice(ei+6).replace(/\n/g,'<br>'):'';
  const jsonStr=t.slice(si+6,ei>-1?ei:undefined).trim();
  let recs=[];
  try{recs=JSON.parse(jsonStr);}catch(e){return t.replace(/\n/g,'<br>');}

  let html=before+'<div class="rec-section"><div class="rec-label">Recomendaciones personalizadas para ti</div>';

  for(const r of recs){
    const imgUrl = r.imagen_query ? await fetchPerfumeImage(r.imagen_query) : null;
    html+=`<div class="rcard">
      ${imgUrl
        ? `<img class="rcard-img" src="${imgUrl}" alt="${r.nombre}" onerror="this.style.display='none'">`
        : `<div class="rcard-img-placeholder">🧴</div>`}
      <div class="rcard-top">
        <div>
          <div class="rcard-name">${r.nombre||''}</div>
          <div class="rcard-house">${r.casa||''}</div>
        </div>
        <div>
          <div class="rcard-pct">${r.match||''}</div>
          <div class="rcard-pct-lbl">match</div>
        </div>
      </div>
      <div class="rcard-body">
        ${r.notas?`<div class="rrow"><span class="rico">🎵</span><div class="rtxt">${r.notas}</div></div>`:''}
        ${r.emocion?`<div class="rrow"><span class="rico">✨</span><div class="rtxt emo">${r.emocion}</div></div>`:''}
        ${r.tecnico?`<div class="rrow"><span class="rico">⚡</span><div class="rtxt">${r.tecnico}</div></div>`:''}
        <div class="rprice"><div class="rprice-val">${r.precio||''}</div><div class="rprice-vendor">${r.vendor||''}</div></div>
      </div>
    </div>`;
  }
  html+='</div>'+after;
  return html;
}

function addMsg(role, html) {
  const c=document.getElementById('chat');
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML=`<div class="av ${role}">${role==='bot'?'◈':'Tú'}</div><div class="bub ${role}">${html}</div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function showTyping(){
  const c=document.getElementById('chat');
  const d=document.createElement('div');
  d.id='typ';d.className='msg bot';
  d.innerHTML=`<div class="av bot">◈</div><div class="bub bot"><div class="tdots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function hideTyping(){const e=document.getElementById('typ');if(e)e.remove();}

async function callAPI(text) {
  msgs.push({role:'user',content:text});
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:msgs,system:getSystem(),fingerprint:FINGERPRINT,userData:profile})
  });
  if(!res.ok)throw new Error(res.status);
  const data=await res.json();
  const reply=data.reply||'Sin respuesta.';
  msgs.push({role:'assistant',content:reply});
  if(data.userProfile)userMemory=data.userProfile;
  return reply;
}

async function send() {
  const inp=document.getElementById('inp');
  const btn=document.getElementById('sbtn');
  const text=inp.value.trim();
  if(!text||busy)return;
  inp.value='';inp.style.height='44px';
  document.getElementById('quick-area').style.display='none';
  busy=true;btn.disabled=true;
  addMsg('user',text.replace(/\n/g,'<br>'));
  extractProfile(text);
  showTyping();
  try {
    const reply=await callAPI(text);
    hideTyping();
    const html=await parseReply(reply);
    addMsg('bot',html);
    extractProfile(reply);
    setPhase(3);
  } catch(e) {
    hideTyping();
    addMsg('bot','Hubo un error de conexión. Por favor intenta de nuevo.');
    console.error(e);
  }
  busy=false;btn.disabled=false;inp.focus();
}

function sq(t){document.getElementById('inp').value=t;send();}
function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}
function ar(el){el.style.height='44px';el.style.height=Math.min(el.scrollHeight,120)+'px';}

// ── INIT ──
Promise.all([getWeather(), loadUserMemory()]).then(() => {
  setTimeout(()=>{
    const isReturn = userMemory && userMemory.visit_count > 0;
    const visits = userMemory?.visit_count || 0;
    const nombre = userMemory?.profile?.nombre || '';
    if(isReturn && visits > 1) {
      addMsg('bot',`¡Bienvenido de vuelta${nombre?' '+nombre:''}! 👋 Es tu visita #${visits+1} a <strong>ScentIQ</strong>.<br><br>Recuerdo tu perfil olfativo. ¿Qué estás buscando hoy? ¿Algo nuevo o continuamos donde lo dejamos?`);
    } else {
      addMsg('bot','Bienvenido. Soy <strong>ScentIQ</strong>, tu asesor personal de perfumes.<br><br>Uso inteligencia real para encontrar el perfume que conecta con tu identidad, tu historia y cómo quieres ser recordado — ajustado al clima de tu ciudad en tiempo real.<br><br>¿Qué estás buscando hoy?');
    }
  },400);
});
