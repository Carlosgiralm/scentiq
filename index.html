<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#f5f0e8">
<title>ScentIQ — Asesor Personal de Perfumes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f0e8;--bg2:#ede8de;--bg3:#e4ddd0;--bg4:#d8d0c0;
  --gold:#8B6914;--gold2:#a07820;--gold3:#c9a84c;--gold-light:#f0e4c0;
  --gold-border:rgba(139,105,20,0.18);--gold-border2:rgba(139,105,20,0.38);
  --text:#2c2418;--text2:#6b5c40;--text3:#9d8e78;--text4:#c4b89e;
  --bot-bg:#3D2F1A;--bot-text:#f0ece4;
  --user-bg:#f0e4c0;--user-border:rgba(139,105,20,0.28);
  --green:#5a8a5a;--red:#c0392b;
  --r:12px;--r2:18px;--r3:28px;
  --shadow:0 2px 10px rgba(44,36,24,0.07);
  --shadow2:0 4px 18px rgba(44,36,24,0.11);
  --shadow3:0 8px 32px rgba(44,36,24,0.15);
}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Inter',sans-serif;color:var(--text);display:flex;flex-direction:column;
  background-image:radial-gradient(ellipse 70% 50% at 15% 85%,rgba(139,105,20,0.06) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(139,105,20,0.04) 0%,transparent 50%)}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;height:100vh;overflow:hidden}
.screen.active{display:flex}

/* ── HEADER ── */
.hdr{padding:.9rem 1.25rem;border-bottom:1px solid var(--gold-border);display:flex;align-items:center;justify-content:space-between;
  background:rgba(245,240,232,0.97);backdrop-filter:blur(20px);flex-shrink:0;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gold-border2);background:var(--bot-bg);
  display:flex;align-items:center;justify-content:center;color:var(--gold3);
  font-family:'Cormorant Garamond',serif;font-size:16px;box-shadow:0 2px 8px rgba(61,47,26,0.25);flex-shrink:0}
.bname{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;letter-spacing:0.05em}
.bname span{color:var(--gold)}
.bsub{font-size:9px;color:var(--text3);letter-spacing:0.12em;text-transform:uppercase;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.weather-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);
  padding:4px 10px;border-radius:20px;border:1px solid var(--gold-border);background:white;box-shadow:var(--shadow)}
.wdot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 4px var(--green);flex-shrink:0}
.user-pill{display:none;align-items:center;gap:5px;font-size:10px;color:var(--gold);
  padding:4px 10px;border-radius:20px;border:1px solid var(--gold-border2);background:var(--gold-light)}

/* ── BACK BUTTON ── */
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);cursor:pointer;padding:4px 0}
.back-btn:active{opacity:.7}

/* ── SCROLLABLE CONTENT ── */
.scroll-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll-content::-webkit-scrollbar{display:none}

/* ── HOME SCREEN ── */
.home-greeting{padding:1.25rem 1.25rem .5rem}
.home-hello{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--text);line-height:1.3}
.home-hello span{color:var(--gold)}
.home-sub{font-size:13px;color:var(--text2);margin-top:4px;line-height:1.5}

.action-grid{padding:.75rem 1.25rem 1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-card{background:white;border:1px solid var(--gold-border);border-radius:var(--r2);padding:16px 14px;
  cursor:pointer;text-align:left;transition:all .18s;display:flex;flex-direction:column;gap:6px;
  box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent;user-select:none}
.action-card:active{transform:scale(0.97);box-shadow:var(--shadow)}
.action-card.featured{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;
  background:var(--bot-bg);border-color:rgba(201,168,76,0.3)}
.action-card.featured .ac-icon{font-size:28px}
.action-card.featured .ac-title{color:var(--gold3);font-size:15px}
.action-card.featured .ac-desc{color:rgba(240,236,228,0.6)}
.action-card.featured:active{transform:scale(0.98)}
.ac-icon{font-size:22px;line-height:1}
.ac-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.2}
.ac-desc{font-size:11px;color:var(--text3);line-height:1.4}

/* ── FLOW SCREEN ── */
.flow-header{padding:1rem 1.25rem;border-bottom:1px solid var(--gold-border);display:flex;align-items:center;gap:12px;flex-shrink:0;background:rgba(245,240,232,0.97)}
.flow-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--text)}
.flow-progress{height:3px;background:var(--bg3);flex-shrink:0}
.flow-progress-fill{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold3));width:0%;transition:width .5s ease}

.flow-content{flex:1;overflow-y:auto;padding:1.5rem 1.25rem;-webkit-overflow-scrolling:touch}
.flow-content::-webkit-scrollbar{display:none}

.flow-question{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--text);line-height:1.35;margin-bottom:.5rem}
.flow-subtitle{font-size:13px;color:var(--text2);margin-bottom:1.25rem;line-height:1.5}

.opt-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem}
.opt-btn{width:100%;padding:14px 16px;border-radius:var(--r2);border:1.5px solid var(--gold-border);
  background:white;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;
  cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;
  transition:all .18s;box-shadow:var(--shadow)}
.opt-btn:active{background:var(--gold-light);border-color:var(--gold-border2)}
.opt-btn.selected{background:var(--gold-light);border-color:var(--gold-border2);color:var(--gold)}
.opt-btn .opt-icon{font-size:20px;flex-shrink:0}
.opt-btn .opt-text{flex:1}
.opt-btn .opt-title{font-weight:500;font-size:14px}
.opt-btn .opt-sub{font-size:11px;color:var(--text3);margin-top:2px}

.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.5rem}
.opt-grid-btn{padding:14px 12px;border-radius:var(--r2);border:1.5px solid var(--gold-border);
  background:white;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;
  cursor:pointer;text-align:center;transition:all .18s;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;gap:6px}
.opt-grid-btn:active,.opt-grid-btn.selected{background:var(--gold-light);border-color:var(--gold-border2);color:var(--gold)}
.opt-grid-btn .og-icon{font-size:24px}
.opt-grid-btn .og-label{font-weight:500;font-size:13px}
.opt-grid-btn .og-sub{font-size:10px;color:var(--text3)}

/* VS CARDS */
.vs-container{display:flex;flex-direction:column;gap:12px;margin-bottom:1.5rem}
.vs-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs-card{padding:16px 12px;border-radius:var(--r2);border:1.5px solid var(--gold-border);
  background:white;cursor:pointer;text-align:center;transition:all .18s;box-shadow:var(--shadow)}
.vs-card:active,.vs-card.selected{background:var(--bot-bg);border-color:var(--bot-bg);color:var(--bot-text)}
.vs-card .vs-icon{font-size:28px;margin-bottom:6px}
.vs-card .vs-label{font-size:12px;font-weight:500;line-height:1.3}
.vs-card .vs-desc{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.3}
.vs-card.selected .vs-desc{color:rgba(240,236,228,0.6)}
.vs-sep{font-size:11px;font-weight:600;color:var(--text3);text-align:center;letter-spacing:.05em}

/* TEXT INPUT */
.flow-input{width:100%;padding:12px 16px;border-radius:var(--r2);border:1.5px solid var(--gold-border);
  background:white;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;
  line-height:1.5;resize:none;margin-bottom:1rem;box-shadow:var(--shadow)}
.flow-input:focus{outline:none;border-color:var(--gold-border2)}

/* INFO CARD */
.info-card{background:var(--gold-light);border:1px solid var(--gold-border2);border-radius:var(--r2);
  padding:16px;margin-bottom:1.25rem}
.info-card-title{font-weight:600;font-size:14px;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.info-card-text{font-size:13px;color:var(--text2);line-height:1.6}
.info-card-highlight{display:inline-block;background:var(--bot-bg);color:var(--gold3);
  font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;margin:4px 4px 0 0}

/* CTA BUTTON */
.cta-btn{width:100%;padding:15px;border-radius:var(--r3);border:none;background:var(--bot-bg);
  color:var(--gold3);font-size:15px;font-weight:500;font-family:'Inter',sans-serif;
  cursor:pointer;transition:all .18s;box-shadow:var(--shadow2);margin-top:.5rem}
.cta-btn:active{opacity:.85;transform:scale(0.98)}
.cta-btn:disabled{opacity:.4;cursor:default}
.cta-btn.secondary{background:white;color:var(--text);border:1.5px solid var(--gold-border)}

/* REC CARDS */
.rec-card{background:white;border:1px solid var(--gold-border);border-radius:var(--r2);overflow:hidden;
  box-shadow:var(--shadow2);margin-bottom:14px}
.rec-card-img{width:100%;height:200px;object-fit:cover;display:block;background:var(--bg2)}
.rec-card-img-placeholder{width:100%;height:200px;background:linear-gradient(135deg,var(--bg2),var(--bg3));
  display:flex;align-items:center;justify-content:center;font-size:56px}
.rec-card-body{padding:16px}
.rec-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.rec-card-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--text);line-height:1.2}
.rec-card-house{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.rec-card-match{text-align:right}
.rec-card-pct{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--gold);line-height:1}
.rec-card-pct-lbl{font-size:9px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.rec-card-why{background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:12px;font-size:13px;color:var(--text2);line-height:1.6}
.rec-card-why strong{color:var(--text);font-weight:500}
.rec-section-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;margin-top:12px}
.pros-cons{display:flex;flex-direction:column;gap:5px}
.pro-item,.con-item{display:flex;gap:7px;align-items:flex-start;font-size:13px;color:var(--text2);line-height:1.4}
.pro-item::before{content:"✓";color:var(--green);font-weight:600;flex-shrink:0}
.con-item::before{content:"✗";color:var(--red);font-weight:600;flex-shrink:0}
.veredicto{background:var(--bot-bg);border-radius:var(--r);padding:12px;margin-top:12px;
  display:flex;align-items:center;gap:10px}
.veredicto-icon{font-size:20px;flex-shrink:0}
.veredicto-text{font-size:13px;color:var(--bot-text);line-height:1.5}
.veredicto-text strong{color:var(--gold3)}
.rec-price-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  padding:10px 12px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--bg3)}
.rec-price{font-size:15px;font-weight:600;color:var(--text)}
.rec-vendor{font-size:11px;color:var(--text3)}
.rec-actions{display:flex;gap:8px;margin-top:10px}
.rec-action-btn{flex:1;padding:11px;border-radius:var(--r2);border:1.5px solid var(--gold-border);
  background:white;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;
  text-align:center;transition:all .18s}
.rec-action-btn:active{background:var(--gold-light)}
.rec-action-btn.primary{background:var(--bot-bg);color:var(--gold3);border-color:var(--bot-bg)}

/* CHAT SCREEN */
.chat-messages{flex:1;overflow-y:auto;padding:1rem 1rem;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.chat-messages::-webkit-scrollbar{display:none}
.chat-msg{display:flex;gap:8px;align-items:flex-end;animation:fu .22s ease}
.chat-msg.user{flex-direction:row-reverse}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.chat-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-av.bot{background:var(--bot-bg);color:var(--gold3);font-family:'Cormorant Garamond',serif;font-size:14px;box-shadow:var(--shadow)}
.chat-av.user{background:var(--gold-light);color:var(--gold);border:1px solid var(--gold-border2);font-size:10px;font-weight:500}
.chat-bub{max-width:80%;padding:10px 14px;font-size:14px;line-height:1.7;border-radius:18px}
.chat-bub.bot{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.chat-bub.user{background:var(--user-bg);color:var(--text);border:1px solid var(--user-border);border-bottom-right-radius:4px}
.chat-input-row{padding:.75rem 1rem;border-top:1px solid var(--gold-border);background:rgba(245,240,232,0.98);
  display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
#chat-inp{flex:1;padding:10px 15px;font-size:14px;border-radius:22px;border:1.5px solid var(--gold-border);
  background:white;color:var(--text);resize:none;font-family:'Inter',sans-serif;
  line-height:1.5;height:42px;max-height:100px;overflow:hidden;transition:border-color .2s}
#chat-inp:focus{outline:none;border-color:var(--gold-border2)}
#chat-inp::placeholder{color:var(--text4)}
.chat-send{width:42px;height:42px;border-radius:50%;background:var(--bot-bg);border:none;
  cursor:pointer;color:var(--gold3);font-size:15px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity .15s;box-shadow:var(--shadow2)}
.chat-send:disabled{opacity:.3}

/* TYPING */
.tdots{display:flex;gap:4px;align-items:center;padding:4px 0}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(240,228,192,0.5);animation:blink 1.3s infinite}
.dot:nth-child(2){animation-delay:.22s}.dot:nth-child(3){animation-delay:.44s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* PROFILE SCREEN */
.profile-content{padding:1.25rem}
.profile-card{background:white;border:1px solid var(--gold-border);border-radius:var(--r2);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.profile-card-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.profile-level{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.level-badge{background:var(--bot-bg);color:var(--gold3);font-size:12px;font-weight:500;
  padding:4px 12px;border-radius:20px}
.level-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.level-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold3));border-radius:3px;transition:width .6s ease}
.taste-tags{display:flex;flex-wrap:wrap;gap:6px}
.taste-tag{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--gold-light);color:var(--gold);border:1px solid var(--gold-border2)}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg3)}
.stat-row:last-child{border-bottom:none}
.stat-label{font-size:13px;color:var(--text2)}
.stat-val{font-size:14px;font-weight:500;color:var(--text)}

/* LINK CARDS */
.link-card{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);
  border:1px solid var(--gold-border);border-radius:var(--r);margin-top:8px;text-decoration:none;
  transition:all .15s}
.link-card:active{background:var(--gold-light)}
.link-card-icon{font-size:18px}
.link-card-info{flex:1}
.link-card-name{font-size:13px;font-weight:500;color:var(--text)}
.link-card-desc{font-size:11px;color:var(--text3);margin-top:1px}
.link-card-arrow{font-size:11px;color:var(--text3)}

/* BOTTOM NAV */
.bottom-nav{display:flex;border-top:1px solid var(--gold-border);background:rgba(245,240,232,0.98);
  backdrop-filter:blur(20px);flex-shrink:0}
.nav-tab{flex:1;padding:.7rem .5rem .6rem;display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;transition:all .15s;border:none;background:transparent}
.nav-tab:active{background:var(--bg2)}
.nav-icon{font-size:20px;line-height:1}
.nav-label{font-size:10px;color:var(--text3);letter-spacing:.03em}
.nav-tab.active .nav-label{color:var(--gold);font-weight:500}
.nav-tab.active .nav-icon{transform:scale(1.1)}

@media(min-width:600px){
  body{max-width:430px;margin:0 auto;box-shadow:0 0 40px rgba(44,36,24,0.15)}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 1: HOME
══════════════════════════════════════════ -->
<div class="screen active" id="screen-home">
  <div class="hdr">
    <div class="brand">
      <div class="logo">◈</div>
      <div>
        <div class="bname">Scent<span>IQ</span></div>
        <div class="bsub">Asesor de perfumes</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="user-pill" id="user-pill">✦ <span id="user-visits"></span></div>
      <div class="weather-pill"><div class="wdot"></div><span id="weather-txt">Cargando...</span></div>
    </div>
  </div>

  <div class="scroll-content">
    <div class="home-greeting">
      <div class="home-hello" id="home-hello">Hola 👋<br>¿Qué quieres hacer <span>hoy</span>?</div>
      <div class="home-sub" id="home-sub">Tu asesor personal de perfumes está listo.</div>
    </div>

    <div class="action-grid">
      <button class="action-card featured" onclick="startFlow('today')">
        <div class="ac-icon">✨</div>
        <div>
          <div class="ac-title">¿Qué perfume uso hoy?</div>
          <div class="ac-desc">Respuesta inmediata según tu clima ahora mismo</div>
        </div>
      </button>

      <button class="action-card" onclick="startFlow('find')">
        <div class="ac-icon">🧴</div>
        <div class="ac-title">Encontrar mi perfume</div>
        <div class="ac-desc">Proceso personalizado para ti</div>
      </button>

      <button class="action-card" onclick="startFlow('beginner')">
        <div class="ac-icon">🌱</div>
        <div class="ac-title">Empezar en perfumería</div>
        <div class="ac-desc">Desde cero, sin términos complicados</div>
      </button>

      <button class="action-card" onclick="startFlow('compare')">
        <div class="ac-icon">⚔️</div>
        <div class="ac-title">Comparar perfumes</div>
        <div class="ac-desc">Cuál encaja mejor para ti</div>
      </button>

      <button class="action-card" onclick="startFlow('gift')">
        <div class="ac-icon">🎁</div>
        <div class="ac-title">Buscar un regalo</div>
        <div class="ac-desc">Recomendaciones seguras</div>
      </button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-tab active" onclick="showScreen('home')">
      <div class="nav-icon">🏠</div><div class="nav-label">Inicio</div>
    </button>
    <button class="nav-tab" onclick="showScreen('chat')">
      <div class="nav-icon">💬</div><div class="nav-label">Chat</div>
    </button>
    <button class="nav-tab" onclick="showScreen('profile')">
      <div class="nav-icon">👤</div><div class="nav-label">Perfil</div>
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 2: FLOW
══════════════════════════════════════════ -->
<div class="screen" id="screen-flow">
  <div class="flow-header">
    <div class="back-btn" onclick="showScreen('home')">← Inicio</div>
    <div class="flow-title" id="flow-title">Encontrar mi perfume</div>
  </div>
  <div class="flow-progress"><div class="flow-progress-fill" id="flow-progress"></div></div>
  <div class="flow-content" id="flow-content"></div>
</div>

<!-- ══════════════════════════════════════════
     SCREEN 3: RESULTS
══════════════════════════════════════════ -->
<div class="screen" id="screen-results">
  <div class="hdr">
    <div class="back-btn" onclick="showScreen('home')">← Inicio</div>

function getFingerprint(){
  const raw=[navigator.userAgent,navigator.language,screen.width+'x'+screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone,navigator.hardwareConcurrency||''].join('|');
  let h=0;for(let i=0;i<raw.length;i++){h=((h<<5)-h)+raw.charCodeAt(i);h|=0;}
  return'fp_'+Math.abs(h).toString(36);
}

async function getWeather(){

    const city=gd.city||'tu ciudad';
    weatherCity=city;
    const lat=gd.latitude,lon=gd.longitude;
    const wr=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relative_humidity_2m&timezone=auto`);
    const wd=await wr.json();
    const temp=Math.round(wd.current_weather?.temperature??0);
    weatherTemp=temp;
    const hum=wd.hourly?.relative_humidity_2m?.[0]??50;
    const code=wd.current_weather?.weathercode??0;
    const cond=code===0?'despejado':code<3?'parcialmente nublado':code<60?'nublado':'lluvia';
    const hour=new Date().getHours();
    weatherMomento=hour<6?'madrugada':hour<12?'mañana':hour<18?'tarde':'noche';
    const consejo=temp>27?'CALIENTE: frescos, cítricos y acuáticos. Evitar orientales pesados.'
      :temp>20?'TEMPLADO: versátil, casi todo funciona.'
      :'FRÍO: orientales, amaderados y especiados proyectan excepcionalmente.';
    weatherCtx=`Ubicación: ${city}. Temperatura: ${temp}°C. Humedad: ${hum}%. Condición: ${cond}. Momento: ${weatherMomento}.\nClima ${consejo}${hum>70?'\nHumedad alta: los perfumes proyectan más de lo normal.':''}`;
    document.getElementById('weather-txt').textContent=`${city} · ${temp}°C ${temp>25?'☀️':temp>15?'🌤':'🌧'}`;

async function callAPI(messages,system){
  const r=await fetch('/api/chat',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages,system:system||getSystemPrompt(),fingerprint:FP,userData:userProfile})
  });
  if(!r.ok)throw new Error(r.status);
  const d=await r.json();
  if(d.userProfile)userMemory={...userMemory,...d.userProfile};
  return d.reply||'';
}

async function generateRecommendations(){
  showScreen('results');
  const rc=document.getElementById('results-content');
  rc.innerHTML=`<div style="text-align:center;padding:3rem 1rem">
    <div style="font-size:48px;margin-bottom:1rem">✨</div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--text);margin-bottom:.5rem">Analizando tu perfil</div>
    <div style="font-size:13px;color:var(--text2)">Buscando los perfumes que mejor encajan contigo...</div>
  </div>`;

  let prompt='';
  if(flowType==='find'){
    const exp=flowData.exp;
    const ocasion=Array.isArray(flowData.ocasion)?flowData.ocasion.join(', '):flowData.ocasion||'uso general';
    const presupuesto=flowData.presupuesto||'medio';
    const tastes=flowData.tastes?`Gustos detectados: ${flowData.tastes.join(', ')}.`:'';
    prompt=`El usuario quiere encontrar su perfume ideal. Experiencia: ${exp}. Ocasión: ${ocasion}. Presupuesto: ${presupuesto}. ${tastes} Clima actual: ${weatherCtx}. Dame máximo 3 recomendaciones con el formato JSON.`;
  } else if(flowType==='today'){
    const plan=flowData.plan||'casual';
    prompt=`El usuario quiere saber qué perfume usar HOY. Plan: ${plan}. Clima actual: ${weatherCtx}. Momento del día: ${weatherMomento}. Dame 1-2 recomendaciones directas y concretas para este momento específico.`;
  } else if(flowType==='compare'){
    prompt=`Compara estos dos perfumes para este usuario: "${flowData.perfA}" vs "${flowData.perfB}". Clima: ${weatherCtx}. Explica las diferencias en lenguaje simple, cuándo usar cada uno y cuál encaja mejor para este usuario según el clima y contexto actual. NO declares un ganador absoluto.`;
  } else if(flowType==='gift'){
    const genero=flowData.generoRegalo||'cualquiera';
    const presupuesto=flowData.presupuesto||'medio';
    prompt=`El usuario busca un regalo de perfume para: ${genero}. Presupuesto: ${presupuesto}. Clima: ${weatherCtx}. Dame 2-3 opciones seguras y bien recibidas con el formato JSON.`;
  }

  try{
    const reply=await callAPI([{role:'user',content:prompt}]);
    renderResults(rc,reply);
  }catch(e){
    rc.innerHTML=`<div style="padding:2rem;text-align:center">
      <div style="font-size:40px;margin-bottom:1rem">😔</div>
      <div style="font-size:15px;color:var(--text2)">Hubo un error de conexión.<br>Por favor intenta de nuevo.</div>
      <button class="cta-btn" onclick="showScreen('home')" style="margin-top:1.5rem;max-width:200px;margin-left:auto;margin-right:auto">Volver al inicio</button>
    </div>`;
  }
}

async function renderResults(container,text){
  if(!text.includes('<RECS>')){
    container.innerHTML=`<div style="padding:.5rem">${text.replace(/\n/g,'<br>')}</div>
      <button class="cta-btn secondary" onclick="showScreen('chat')" style="margin:1rem">Seguir conversando →</button>`;
    return;
  }
  const si=text.indexOf('<RECS>'),ei=text.indexOf('</RECS>');
  const before=text.slice(0,si).trim();
  const after=ei>-1?text.slice(ei+6).trim():'';
  let recs=[];
  try{recs=JSON.parse(text.slice(si+6,ei>-1?ei:undefined).trim());}catch(e){
    container.innerHTML=`<div>${text.replace(/\n/g,'<br>')}</div>`;return;
  }

  let html=before?`<p style="font-size:14px;color:var(--text2);margin-bottom:1rem;line-height:1.6">${before}</p>`:'';

  for(const r of recs){
    const imgUrl=r.imagen_query?await fetchImage(r.imagen_query):null;
    const pros=(r.pros||[]).map(p=>`<div class="pro-item">${p}</div>`).join('');
    const contras=(r.contras||[]).map(c=>`<div class="con-item">${c}</div>`).join('');
    const vIcon=r.veredicto?.includes('comprar')||r.veredicto?.includes('compraría')?'✅':r.veredicto?.includes('decant')?'🧪':'⚠️';
    html+=`<div class="rec-card">
      ${imgUrl?`<img class="rec-card-img" src="${imgUrl}" alt="${r.nombre}" onerror="this.style.display='none'">`:`<div class="rec-card-img-placeholder">🧴</div>`}
      <div class="rec-card-body">
        <div class="rec-card-header">
          <div><div class="rec-card-name">${r.nombre}</div><div class="rec-card-house">${r.casa}</div></div>
          <div class="rec-card-match"><div class="rec-card-pct">${r.match}</div><div class="rec-card-pct-lbl">match</div></div>
        </div>
        ${r.notas?`<div style="font-size:11px;color:var(--text3);margin-bottom:10px;letter-spacing:.03em">🎵 ${r.notas}</div>`:''}
        ${r.por_que?`<div class="rec-card-why"><strong>¿Por qué para ti?</strong><br>${r.por_que}</div>`:''}
        ${r.cuando?`<div style="font-size:13px;color:var(--text2);margin-bottom:4px"><strong>¿Cuándo usarlo?</strong> ${r.cuando}</div>`:''}
        ${pros?`<div class="rec-section-title">Pros</div><div class="pros-cons">${pros}</div>`:''}
        ${contras?`<div class="rec-section-title">Contras</div><div class="pros-cons">${contras}</div>`:''}
        ${r.veredicto?`<div class="veredicto"><div class="veredicto-icon">${vIcon}</div><div class="veredicto-text"><strong>Veredicto ScentIQ:</strong> ${r.veredicto}</div></div>`:''}
        <div class="rec-price-row"><div class="rec-price">${r.precio||''}</div><div class="rec-vendor">${r.vendor||''}</div></div>
        <div class="rec-actions">
          <button class="rec-action-btn" onclick="chatWithContext('Quiero saber más sobre ${r.nombre}')">💬 Saber más</button>
          <button class="rec-action-btn primary" onclick="chatWithContext('Quiero comprar ${r.nombre}. ¿Dónde lo consigo?')">🛍️ ¿Dónde comprar?</button>
        </div>
      </div>
    </div>`;
  }

  if(after)html+=`<p style="font-size:13px;color:var(--text2);margin-top:.5rem;line-height:1.6">${after}</p>`;
  html+=`<button class="cta-btn secondary" onclick="showScreen('home')" style="margin-bottom:1.5rem">← Volver al inicio</button>`;
  container.innerHTML=html;
}

function chatWithContext(msg){
  showScreen('chat');
  setTimeout(()=>{
    document.getElementById('chat-inp').value=msg;
    chatSend();
  },300);
}

async function fetchImage(q){
  try{
    const r=await fetch(`/api/image?q=${encodeURIComponent(q)}`);
    if(!r.ok)return null;
    const d=await r.json();
    return d.imageUrl||null;
  }catch(e){return null;}
}

// ══ CHAT ══
let chatInited=false;
function initChat(){
  if(chatInited)return;
  chatInited=true;
  addChatMsg('bot','Hola 👋 Soy ScentIQ. Puedes preguntarme lo que quieras sobre perfumes — desde recomendaciones hasta dudas técnicas. ¿En qué te ayudo?');
}

function addChatMsg(role,html){
  const c=document.getElementById('chat-messages');
  const d=document.createElement('div');
  d.className='chat-msg '+role;
  d.innerHTML=`<div class="chat-av ${role}">${role==='bot'?'◈':'Tú'}</div><div class="chat-bub ${role}">${html}</div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function showChatTyping(){
  const c=document.getElementById('chat-messages');
  const d=document.createElement('div');
  d.id='chat-typ';d.className='chat-msg bot';
  d.innerHTML=`<div class="chat-av bot">◈</div><div class="chat-bub bot"><div class="tdots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function hideChatTyping(){const e=document.getElementById('chat-typ');if(e)e.remove();}

async function chatSend(){
  const inp=document.getElementById('chat-inp');
  const btn=document.getElementById('chat-send');
  const text=inp.value.trim();
  if(!text||chatBusy)return;
  inp.value='';inp.style.height='42px';
  chatBusy=true;btn.disabled=true;
  addChatMsg('user',text.replace(/\n/g,'<br>'));
  chatMsgs.push({role:'user',content:text});
  showChatTyping();
  try{
    const reply=await callAPI(chatMsgs);
    hideChatTyping();
    const clean=reply.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/#{1,3}\s?(.*)/g,'<strong>$1</strong>').replace(/---/g,'').replace(/\n/g,'<br>');
    addChatMsg('bot',clean);
    chatMsgs.push({role:'assistant',content:reply});
  }catch(e){
    hideChatTyping();
    addChatMsg('bot','Hubo un error de conexión. Intenta de nuevo.');
  }
  chatBusy=false;btn.disabled=false;inp.focus();
}

function chatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend();}}
function chatResize(el){el.style.height='42px';el.style.height=Math.min(el.scrollHeight,100)+'px';}

      ${p.edad?`<div class="stat-row"><div class="stat-label">Edad</div><div class="stat-val">${p.edad}</div></div>`:''}

      ${!p.genero&&!p.ciudad?`<div style="font-size:13px;color:var(--text3);padding:.5rem 0">Completa tu perfil usando los flujos de recomendación.</div>`:''}
